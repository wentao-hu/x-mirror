<h2 id="sec-1">先手工上几个站</h2>
<p>新手想用 AI 自动化上站，卡卡西、Simon Liang 的建议是：先手工上几个站，再谈自动化。</p>
<h2 id="sec-2">为什么</h2>
<p>自己要先能判断 AI 做得对不对、懂基本术语，之后才能用好 AI。</p>
